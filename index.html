<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MemorABBYlia - Event Booking Entry</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Montserrat', sans-serif; background-color: #faf7f8; }
    .brand-font { font-family: 'Playfair Display', serif; }
  </style>
</head>
<body class="min-h-screen p-4 sm:p-6 flex items-center justify-center">

  <div class="max-w-xl w-full bg-white rounded-2xl shadow-xl border border-pink-100 overflow-hidden">
    <!-- Header -->
    <div class="bg-gradient-to-r from-pink-800 to-rose-900 text-white p-6 text-center">
      <h1 class="brand-font text-2xl sm:text-3xl font-bold tracking-wide">MemorABBYlia</h1>
      <p class="text-xs uppercase tracking-widest text-pink-200 mt-1">Finest Treasures — Order & Booking Form</p>
    </div>

    <!-- Form -->
    <form id="bookingForm" class="p-6 space-y-5">
      
      <!-- Webhook Configuration -->
      <div class="bg-slate-50 border border-slate-200 p-4 rounded-xl space-y-2">
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider">🔗 Google Sheet Webhook URL</label>
        <div class="flex gap-2">
          <input type="url" id="webhookUrlInput" placeholder="https://script.google.com/macros/s/.../exec" required
            class="w-full border border-slate-300 rounded-lg p-2 text-xs focus:ring-2 focus:ring-pink-500 focus:outline-none">
          <button type="button" onclick="saveAndSync()" class="bg-slate-800 hover:bg-slate-700 text-white font-semibold text-xs px-3 py-2 rounded-lg transition whitespace-nowrap">
            Sync Packages
          </button>
        </div>
        <p id="webhookStatus" class="text-[11px] text-slate-500 italic">Paste your Apps Script Web App URL to load packages live.</p>
      </div>

      <!-- 1. Client Details -->
      <div class="space-y-4">
        <h2 class="text-sm font-bold text-gray-400 uppercase tracking-wider">1. Client Details</h2>
        <div>
          <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Client Name *</label>
          <input type="text" id="clientName" required placeholder="e.g. Maria Santos" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-pink-500 focus:outline-none">
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Event Date *</label>
            <input type="date" id="eventDate" required class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-pink-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Event Type *</label>
            <select id="eventType" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-pink-500 focus:outline-none">
              <option>Wedding</option><option>Debut</option><option>Birthday</option>
              <option>Corporate</option><option>Brand Activation</option><option>Anniversary</option><option>Private Party</option>
            </select>
          </div>
        </div>
      </div>

      <hr class="border-gray-100">

      <!-- 2. Package & Service Selection (Multi-Service Enabled) -->
      <div class="space-y-4">
        <div class="flex justify-between items-center">
          <h2 class="text-sm font-bold text-gray-400 uppercase tracking-wider">2. Services & Booth Packages</h2>
          <button type="button" onclick="addServiceBlock()" class="bg-rose-100 hover:bg-rose-200 text-rose-900 text-xs font-bold px-3 py-1 rounded-lg transition">
            + Add Another Service
          </button>
        </div>

        <div id="servicesContainer" class="space-y-4">
          <!-- Initial Service Block -->
          <div class="service-block bg-slate-50 border border-slate-200 rounded-xl p-4 space-y-3 relative">
            <button type="button" onclick="removeServiceBlock(this)" class="absolute top-2 right-3 text-gray-400 hover:text-rose-600 font-bold text-sm">✕ Remove</button>
            
            <div>
              <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Service / Booth *</label>
              <select onchange="updateServiceBlock(this)" class="service-select w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-pink-500 focus:outline-none bg-white" required>
                <option value="">-- Load Webhook First --</option>
              </select>
            </div>

            <div class="inclusions-box bg-white border border-gray-200 rounded-lg p-2.5 text-xs text-gray-500 italic">
              Select a Service / Booth above to view inclusions.
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
              <div>
                <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Volume / Pax *</label>
                <select onchange="calculateTotal()" class="pax-select w-full border border-gray-300 rounded-lg p-2 text-xs focus:ring-2 focus:ring-pink-500 focus:outline-none bg-white" required>
                  <option value="">-- Select Service --</option>
                </select>
              </div>
              <div>
                <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Rate (PHP)</label>
                <input type="number" readonly class="rate-input w-full bg-gray-100 border border-gray-300 rounded-lg p-2 text-xs font-semibold text-gray-700">
              </div>
              <div>
                <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Add-ons (PHP)</label>
                <input type="number" value="0" min="0" oninput="calculateTotal()" class="addon-input w-full border border-gray-300 rounded-lg p-2 text-xs font-semibold">
              </div>
            </div>
          </div>
        </div>
      </div>

      <hr class="border-gray-100">

      <!-- 3. Payment & Total -->
      <div class="space-y-4">
        <h2 class="text-sm font-bold text-gray-400 uppercase tracking-wider">3. Payment & Notes</h2>

        <div>
          <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Payment Status</label>
          <select id="paymentStatus" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-pink-500 focus:outline-none">
            <option>Pending</option><option>50% Deposit Paid</option><option>Fully Paid</option><option>Unpaid</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Notes / Special Requests</label>
          <textarea id="notes" rows="3" placeholder="e.g. Venue setup times, custom branding details..." class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-pink-500 focus:outline-none"></textarea>
        </div>

        <div class="bg-pink-50 p-4 rounded-xl flex justify-between items-center border border-pink-100">
          <span class="text-sm font-bold text-pink-900">Grand Total (All Services):</span>
          <span id="displayTotal" class="text-2xl font-bold text-pink-800">₱0.00</span>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="submitBtn" class="w-full bg-rose-900 hover:bg-rose-800 text-white font-bold py-3 rounded-xl transition shadow-lg text-sm uppercase tracking-wider">
        Submit
      </button>

      <div id="statusMessage" class="hidden text-center text-sm font-medium p-3 rounded-lg"></div>
    </form>
  </div>

  <script>
    let packageCatalog = {};

    window.addEventListener("DOMContentLoaded", () => {
      const savedUrl = localStorage.getItem("memorabbylia_webhook_url");
      if (savedUrl) {
        document.getElementById("webhookUrlInput").value = savedUrl;
        fetchPackagesFromSheet(savedUrl);
      }
    });

    function saveAndSync() {
      const url = document.getElementById("webhookUrlInput").value.trim();
      if (!url) return alert("Please enter a valid Webhook URL.");
      localStorage.setItem("memorabbylia_webhook_url", url);
      fetchPackagesFromSheet(url);
    }

    function fetchPackagesFromSheet(url) {
      fetch(url)
        .then(res => res.json())
        .then(data => {
          if (data.status === "success" && data.catalog) {
            packageCatalog = data.catalog;
            populateAllServiceDropdowns();
            document.getElementById("webhookStatus").innerText = "✓ Packages synced live!";
            document.getElementById("webhookStatus").className = "text-[11px] text-emerald-600 font-medium";
          }
        })
        .catch(err => {
          document.getElementById("webhookStatus").innerText = "⚠ Sync failed. Check Webhook URL.";
          document.getElementById("webhookStatus").className = "text-[11px] text-rose-600 font-medium";
        });
    }

    function populateAllServiceDropdowns() {
      document.querySelectorAll(".service-select").forEach(select => {
        const selectedVal = select.value;
        select.innerHTML = '<option value="">-- Select Service --</option>';
        Object.keys(packageCatalog).forEach(service => {
          const opt = document.createElement("option");
          opt.value = service;
          opt.innerText = service;
          select.appendChild(opt);
        });
        select.value = selectedVal;
      });
    }

    function addServiceBlock() {
      const container = document.getElementById("servicesContainer");
      const block = document.createElement("div");
      block.className = "service-block bg-slate-50 border border-slate-200 rounded-xl p-4 space-y-3 relative";
      block.innerHTML = `
        <button type="button" onclick="removeServiceBlock(this)" class="absolute top-2 right-3 text-gray-400 hover:text-rose-600 font-bold text-sm">✕ Remove</button>
        <div>
          <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Service / Booth *</label>
          <select onchange="updateServiceBlock(this)" class="service-select w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-pink-500 focus:outline-none bg-white" required>
            <option value="">-- Select Service --</option>
          </select>
        </div>
        <div class="inclusions-box bg-white border border-gray-200 rounded-lg p-2.5 text-xs text-gray-500 italic">Select a Service / Booth above to view inclusions.</div>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div>
            <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Volume / Pax *</label>
            <select onchange="calculateTotal()" class="pax-select w-full border border-gray-300 rounded-lg p-2 text-xs focus:ring-2 focus:ring-pink-500 focus:outline-none bg-white" required>
              <option value="">-- Select Service --</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Rate (PHP)</label>
            <input type="number" readonly class="rate-input w-full bg-gray-100 border border-gray-300 rounded-lg p-2 text-xs font-semibold text-gray-700">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Add-ons (PHP)</label>
            <input type="number" value="0" min="0" oninput="calculateTotal()" class="addon-input w-full border border-gray-300 rounded-lg p-2 text-xs font-semibold">
          </div>
        </div>
      `;
      container.appendChild(block);
      populateAllServiceDropdowns();
    }

    function removeServiceBlock(btn) {
      const container = document.getElementById("servicesContainer");
      if (container.children.length > 1) {
        btn.parentElement.remove();
        calculateTotal();
      } else {
        alert("At least one service is required.");
      }
    }

    function updateServiceBlock(selectElem) {
      const block = selectElem.closest(".service-block");
      const service = selectElem.value;
      const paxSelect = block.querySelector(".pax-select");
      const inclusionsDisplay = block.querySelector(".inclusions-box");

      paxSelect.innerHTML = '<option value="">-- Select Pax --</option>';

      if (service && packageCatalog[service]) {
        inclusionsDisplay.innerText = packageCatalog[service].inclusions || "Standard booth setup.";
        inclusionsDisplay.className = "inclusions-box bg-rose-50 border border-rose-200 rounded-lg p-2.5 text-xs text-rose-900 font-medium";

        const options = packageCatalog[service].options || {};
        Object.keys(options).forEach(pax => {
          const opt = document.createElement("option");
          opt.value = pax;
          opt.innerText = pax;
          paxSelect.appendChild(opt);
        });
      } else {
        inclusionsDisplay.innerText = "Select a Service / Booth above to view inclusions.";
        inclusionsDisplay.className = "inclusions-box bg-white border border-gray-200 rounded-lg p-2.5 text-xs text-gray-500 italic";
      }
      calculateTotal();
    }

    function calculateTotal() {
      let grandTotal = 0;

      document.querySelectorAll(".service-block").forEach(block => {
        const service = block.querySelector(".service-select").value;
        const pax = block.querySelector(".pax-select").value;
        const addon = parseFloat(block.querySelector(".addon-input").value) || 0;
        const rateInput = block.querySelector(".rate-input");

        let rate = 0;
        if (service && pax && packageCatalog[service] && packageCatalog[service].options && packageCatalog[service].options[pax]) {
          rate = packageCatalog[service].options[pax];
        }

        rateInput.value = rate;
        grandTotal += rate + addon;
      });

      document.getElementById("displayTotal").innerText = "₱" + grandTotal.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    document.getElementById("bookingForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const scriptUrl = document.getElementById("webhookUrlInput").value.trim();
      const statusMsg = document.getElementById("statusMessage");

      if (!scriptUrl) {
        statusMsg.classList.remove("hidden", "bg-emerald-100", "text-emerald-800");
        statusMsg.classList.add("bg-rose-100", "text-rose-700");
        statusMsg.innerText = "Please enter and save your Webhook URL before submitting.";
        return;
      }

      const submitBtn = document.getElementById("submitBtn");
      submitBtn.disabled = true;
      submitBtn.innerText = "Submitting...";

      let servicesList = [];
      document.querySelectorAll(".service-block").forEach(block => {
        servicesList.push({
          serviceSelected: block.querySelector(".service-select").value,
          packagePax: block.querySelector(".pax-select").value,
          unitRate: block.querySelector(".rate-input").value,
          quantity: 1,
          taxAddons: block.querySelector(".addon-input").value || 0
        });
      });

      const payload = {
        clientName: document.getElementById("clientName").value,
        eventDate: document.getElementById("eventDate").value,
        eventType: document.getElementById("eventType").value,
        paymentStatus: document.getElementById("paymentStatus").value,
        notes: document.getElementById("notes").value,
        services: servicesList
      };

      fetch(scriptUrl, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
      .then(() => {
        statusMsg.classList.remove("hidden", "bg-rose-100", "text-rose-700");
        statusMsg.classList.add("bg-emerald-100", "text-emerald-800");
        statusMsg.innerText = "✓ All booked services submitted successfully!";
        document.getElementById("bookingForm").reset();
        document.getElementById("webhookUrlInput").value = scriptUrl;
        document.getElementById("displayTotal").innerText = "₱0.00";
      })
      .catch(err => {
        statusMsg.classList.remove("hidden", "bg-emerald-100", "text-emerald-800");
        statusMsg.classList.add("bg-rose-100", "text-rose-700");
        statusMsg.innerText = "Error submitting booking. Please check Webhook URL.";
      })
      .finally(() => {
        submitBtn.disabled = false;
        submitBtn.innerText = "Submit";
      });
    });
  </script>
</body>
</html>
