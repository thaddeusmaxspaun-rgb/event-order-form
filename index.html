<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MemorABBYlia - Event Booking Entry</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Montserrat', sans-serif; background-color: #faf7f8; }
    .brand-font { font-family: 'Playfair Display', serif; }
  </style>
</head>
<body class="min-h-screen p-4 sm:p-6 flex items-center justify-center">

  <div class="max-w-xl w-full bg-white rounded-2xl shadow-xl border border-pink-100 overflow-hidden">
    <!-- Header -->
    <div class="bg-gradient-to-r from-pink-800 to-rose-900 text-white p-6 text-center">
      <h1 class="brand-font text-2xl sm:text-3xl font-bold tracking-wide">MemorABBYlia</h1>
      <p class="text-xs uppercase tracking-widest text-pink-200 mt-1">Finest Treasures — Order & Booking Form</p>
    </div>

    <!-- Form -->
    <form id="bookingForm" class="p-6 space-y-5">
      
      <!-- Webhook Configuration -->
      <div class="bg-slate-50 border border-slate-200 p-4 rounded-xl space-y-2">
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider">
          🔗 Google Sheet Webhook URL
        </label>
        <div class="flex gap-2">
          <input type="url" id="webhookUrlInput" placeholder="https://script.google.com/macros/s/.../exec" required
            class="w-full border border-slate-300 rounded-lg p-2 text-xs focus:ring-2 focus:ring-pink-500 focus:outline-none">
          <button type="button" onclick="saveAndSync()" 
            class="bg-slate-800 hover:bg-slate-700 text-white font-semibold text-xs px-3 py-2 rounded-lg transition whitespace-nowrap">
            Sync Packages
          </button>
        </div>
        <p id="webhookStatus" class="text-[11px] text-slate-500 italic">Paste your Apps Script Web App URL to load packages and Pax options live.</p>
      </div>

      <!-- Client Details -->
      <div class="space-y-4">
        <h2 class="text-sm font-bold text-gray-400 uppercase tracking-wider">1. Client Details</h2>
        
        <div>
          <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Client Name *</label>
          <input type="text" id="clientName" required placeholder="e.g. Maria Santos" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-pink-500 focus:outline-none">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Event Date *</label>
            <input type="date" id="eventDate" required class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-pink-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Event Type *</label>
            <select id="eventType" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-pink-500 focus:outline-none">
              <option>Wedding</option>
              <option>Debut</option>
              <option>Birthday</option>
              <option>Corporate</option>
              <option>Brand Activation</option>
              <option>Anniversary</option>
              <option>Private Party</option>
            </select>
          </div>
        </div>
      </div>

      <hr class="border-gray-100">

      <!-- Dynamic Package & Pax Selection -->
      <div class="space-y-4">
        <div class="flex justify-between items-center">
          <h2 class="text-sm font-bold text-gray-400 uppercase tracking-wider">2. Package Selection</h2>
          <span id="syncIndicator" class="text-[11px] font-semibold text-amber-600 bg-amber-50 px-2 py-0.5 rounded">Syncing...</span>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Service / Booth *</label>
          <select id="serviceSelected" onchange="updatePaxOptions()" disabled class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-pink-500 focus:outline-none bg-gray-50">
            <option value="">-- Load Webhook First --</option>
          </select>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Pax / Volume *</label>
            <select id="packagePax" onchange="calculateTotal()" disabled class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-pink-500 focus:outline-none bg-gray-50">
              <option value="">-- Select Service First --</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Unit Rate (PHP)</label>
            <input type="number" id="unitRate" readonly class="w-full bg-gray-100 border border-gray-300 rounded-lg p-2.5 text-sm font-semibold text-gray-700">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Quantity</label>
            <input type="number" id="quantity" value="1" min="1" onchange="calculateTotal()" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-pink-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Add-ons / Customization (PHP)</label>
            <input type="number" id="taxAddons" value="0" min="0" onchange="calculateTotal()" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-pink-500 focus:outline-none">
          </div>
        </div>
      </div>

      <hr class="border-gray-100">

      <!-- Financial Calculation & Payment Status -->
      <div class="space-y-4">
        <h2 class="text-sm font-bold text-gray-400 uppercase tracking-wider">3. Payment & Notes</h2>

        <div>
          <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Payment Status</label>
          <select id="paymentStatus" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-pink-500 focus:outline-none">
            <option>Pending</option>
            <option>50% Deposit Paid</option>
            <option>Fully Paid</option>
            <option>Unpaid</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Notes / Special Requests</label>
          <textarea id="notes" rows="3" placeholder="e.g. Preferred scent choices, venue setup instructions..." class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-pink-500 focus:outline-none"></textarea>
        </div>

        <div class="bg-pink-50 p-4 rounded-xl flex justify-between items-center border border-pink-100">
          <span class="text-sm font-bold text-pink-900">Calculated Total:</span>
          <span id="displayTotal" class="text-2xl font-bold text-pink-800">₱0.00</span>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="submitBtn" class="w-full bg-rose-900 hover:bg-rose-800 text-white font-bold py-3 rounded-xl transition shadow-lg text-sm uppercase tracking-wider">
        Submit
      </button>

      <div id="statusMessage" class="hidden text-center text-sm font-medium p-3 rounded-lg"></div>
    </form>
  </div>

  <script>
    let packageCatalog = {};

    window.addEventListener("DOMContentLoaded", () => {
      const savedUrl = localStorage.getItem("memorabbylia_webhook_url");
      if (savedUrl) {
        document.getElementById("webhookUrlInput").value = savedUrl;
        fetchPackagesFromSheet(savedUrl);
      } else {
        document.getElementById("syncIndicator").innerText = "Awaiting Webhook";
        document.getElementById("syncIndicator").className = "text-[11px] font-semibold text-gray-500 bg-gray-100 px-2 py-0.5 rounded";
      }
    });

    function saveAndSync() {
      const url = document.getElementById("webhookUrlInput").value.trim();
      if (!url) {
        alert("Please enter a valid Webhook URL.");
        return;
      }
      localStorage.setItem("memorabbylia_webhook_url", url);
      fetchPackagesFromSheet(url);
    }

    function fetchPackagesFromSheet(url) {
      const indicator = document.getElementById("syncIndicator");
      const status = document.getElementById("webhookStatus");

      indicator.innerText = "Syncing...";
      indicator.className = "text-[11px] font-semibold text-amber-600 bg-amber-50 px-2 py-0.5 rounded";

      fetch(url)
        .then(res => res.json())
        .then(data => {
          if (data.status === "success" && data.catalog) {
            packageCatalog = data.catalog;
            populateServiceDropdown();
            indicator.innerText = "✓ Live Synced";
            indicator.className = "text-[11px] font-semibold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded";
            status.innerText = "✓ Packages and Pax options synced live from Google Sheets!";
            status.className = "text-[11px] text-emerald-600 font-medium";
          } else {
            throw new Error("Invalid format");
          }
        })
        .catch(err => {
          indicator.innerText = "Sync Failed";
          indicator.className = "text-[11px] font-semibold text-rose-600 bg-rose-50 px-2 py-0.5 rounded";
          status.innerText = "⚠ Could not fetch packages. Check Webhook URL.";
          status.className = "text-[11px] text-rose-600 font-medium";
        });
    }

    function populateServiceDropdown() {
      const serviceSelect = document.getElementById("serviceSelected");
      serviceSelect.innerHTML = '<option value="">-- Select Service --</option>';
      serviceSelect.disabled = false;
      serviceSelect.classList.remove("bg-gray-50");

      Object.keys(packageCatalog).forEach(service => {
        const opt = document.createElement("option");
        opt.value = service;
        opt.innerText = service;
        serviceSelect.appendChild(opt);
      });
    }

    // Pulls Pax / Volume values from the fetched Google Sheet catalog
    function updatePaxOptions() {
      const service = document.getElementById("serviceSelected").value;
      const paxSelect = document.getElementById("packagePax");
      paxSelect.innerHTML = '<option value="">-- Select Pax --</option>';
      
      if (service && packageCatalog[service]) {
        paxSelect.disabled = false;
        paxSelect.classList.remove("bg-gray-50");

        // Loop over the Pax / Volume entries pulled directly from Column D in Google Sheets
        Object.keys(packageCatalog[service]).forEach(pax => {
          const opt = document.createElement("option");
          opt.value = pax;
          opt.innerText = pax;
          paxSelect.appendChild(opt);
        });
      } else {
        paxSelect.disabled = true;
        paxSelect.classList.add("bg-gray-50");
      }
      calculateTotal();
    }

    function calculateTotal() {
      const service = document.getElementById("serviceSelected").value;
      const pax = document.getElementById("packagePax").value;
      const qty = parseInt(document.getElementById("quantity").value) || 1;
      const addons = parseFloat(document.getElementById("taxAddons").value) || 0;
      
      let rate = 0;
      if (service && pax && packageCatalog[service] && packageCatalog[service][pax]) {
        rate = packageCatalog[service][pax];
      }

      document.getElementById("unitRate").value = rate;
      const total = (rate * qty) + addons;
      document.getElementById("displayTotal").innerText = "₱" + total.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    document.getElementById("bookingForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const scriptUrl = document.getElementById("webhookUrlInput").value.trim();
      const statusMsg = document.getElementById("statusMessage");

      if (!scriptUrl) {
        statusMsg.classList.remove("hidden", "bg-emerald-100", "text-emerald-800");
        statusMsg.classList.add("bg-rose-100", "text-rose-700");
        statusMsg.innerText = "Please enter and save your Webhook URL before submitting.";
        return;
      }

      const submitBtn = document.getElementById("submitBtn");
      submitBtn.disabled = true;
      submitBtn.innerText = "Submitting...";

      const formData = {
        clientName: document.getElementById("clientName").value,
        eventDate: document.getElementById("eventDate").value,
        eventType: document.getElementById("eventType").value,
        serviceSelected: document.getElementById("serviceSelected").value,
        packagePax: document.getElementById("packagePax").value,
        unitRate: document.getElementById("unitRate").value,
        quantity: document.getElementById("quantity").value,
        taxAddons: document.getElementById("taxAddons").value,
        paymentStatus: document.getElementById("paymentStatus").value,
        notes: document.getElementById("notes").value
      };

      fetch(scriptUrl, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(formData)
      })
      .then(() => {
        statusMsg.classList.remove("hidden", "bg-rose-100", "text-rose-700");
        statusMsg.classList.add("bg-emerald-100", "text-emerald-800");
        statusMsg.innerText = "✓ Booking submitted successfully!";
        document.getElementById("bookingForm").reset();
        document.getElementById("webhookUrlInput").value = scriptUrl;
        document.getElementById("displayTotal").innerText = "₱0.00";
      })
      .catch(err => {
        statusMsg.classList.remove("hidden", "bg-emerald-100", "text-emerald-800");
        statusMsg.classList.add("bg-rose-100", "text-rose-700");
        statusMsg.innerText = "Error submitting booking. Please check your Webhook URL.";
      })
      .finally(() => {
        submitBtn.disabled = false;
        submitBtn.innerText = "Submit";
      });
    });
  </script>
</body>
</html>
